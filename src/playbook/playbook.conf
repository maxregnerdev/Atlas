<Playbook>
	<Name>MaxRegnerUI</Name>
	<Username>MaxRegnerUI</Username>
	<Title>MaxRegnerUI v1.0.0 - Ultimate Windows Transformation</Title>
	<ShortDescription>MaxRegnerUI - Revolutionary UI with Custom Icon Pack</ShortDescription>
	<Description><![CDATA[MaxRegnerUI v1.0.0 - COMPLETE WINDOWS TRANSFORMATION

REVOLUTIONARY NEW UI DESIGN - NEVER SEEN BEFORE
==============================================

MaxRegnerUI completely transforms Windows with:

NEW UI FEATURES:
- Custom MaxRegnerUI icon pack system-wide
- Revolutionary new design never seen before
- Exclusive MaxRegnerUI themes (Dark, Light, Solid)
- Full system customization
- Enhanced privacy and security
- Maximum performance optimizations

This is the ultimate Windows experience with MaxRegnerUI exclusive features and design.]]></Description>
	<Details>MaxRegnerUI - Complete Windows transformation with custom icons, themes, and exclusive features never seen before.</Details>
	<ProgressText><![CDATA[MaxRegnerUI is installing custom icon pack, applying new UI design, and transforming Windows with exclusive features.]]></ProgressText>
	<Version>1.0.0</Version>
	<SupportedBuilds>
		<string>26100</string>
		<string>26200</string>
	</SupportedBuilds>
	<UpgradableFrom>0.4.1</UpgradableFrom>
	<Requirements>
		<Requirement>DefenderToggled</Requirement>
		<Requirement>NoAntivirus</Requirement>
		<Requirement>Internet</Requirement>
		<Requirement>NoPendingUpdates</Requirement>
		<Requirement>UCPDDisabled</Requirement>
		<Requirement>PluggedIn</Requirement>
	</Requirements>
	<UniqueId>MAXREGNERUI-2024-ULTIMATE-0001</UniqueId>
	<InstallGuide>https://maxregnerui.com/installation</InstallGuide>
	<Overhaul>true</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<AllowUnsupportedUpgrades>false</AllowUnsupportedUpgrades>
	<ProductCode>64</ProductCode>
	<EstimatedMinutes>20</EstimatedMinutes>
	<Git>https://github.com/maxregnerdev/Atlas</Git>
	<Website>https://maxregnerui.com</Website>
	<DonateLink>https://ko-fi.com/maxregnerui</DonateLink>
	<SupportsISO>true</SupportsISO>
	<OOBE>
		<BulletPoints>
			<BulletPoint Icon="Rocket" Title="Revolutionary UI Design"
			Description="Completely new Windows interface with MaxRegnerUI custom icon pack never seen before."/>
			<BulletPoint Icon="Lock" Title="Ultimate Customization"
			Description="Full system-wide icon replacement, custom themes, and exclusive MaxRegnerUI features."/>
			<BulletPoint Icon="Privacy" Title="Enhanced Privacy & Security"
			Description="Eliminates tracking while adding MaxRegnerUI exclusive privacy features and controls."/>
		</BulletPoints>
		<Internet>Force</Internet>
	</OOBE>
	<ISO>
		<DisableBitLocker>true</DisableBitLocker>
		<DisableHardwareRequirements>true</DisableHardwareRequirements>
	</ISO>
	<FeaturePages>
		<RadioPage IsRequired="true" DefaultOption="defender-enable" Description="Disabling Defender reduces security, and is an option for advanced users only.">
			<TopLine Text="Defender can be toggled in the MaxRegnerUI folder."/>
			<Options>
				<RadioOption>
					<Text>Enable Defender (recommended)</Text>
					<Name>defender-enable</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable Defender</Text>
					<Name>defender-disable</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://maxregnerui.com/docs/security/defender"/>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="mitigations-default" Description="Disabling mitigations reduces security, and could harm performance on modern CPUs.">
			<TopLine Text="Disabling could improve performance on older CPUs."/>
			<Options>
				<RadioOption>
					<Text>Default Windows Mitigations (recommended)</Text>
					<Name>mitigations-default</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable All Mitigations</Text>
					<Name>mitigations-disable</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://maxregnerui.com/docs/security/mitigations"/>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="auto-updates-disable" Description="Updates are important for security, you'll get update notifications regardless.">
			<TopLine Text="This can be changed in the MaxRegnerUI folder later."/>
			<Options>
				<RadioOption>
					<Text>Disable Automatic Windows Updates</Text>
					<Name>auto-updates-disable</Name>
				</RadioOption>
				<RadioOption>
					<Text>Enable Automatic Windows Updates</Text>
					<Name>auto-updates-default</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://maxregnerui.com/docs/configuration/updates"/>
		</RadioPage>
		<CheckboxPage IsRequired="true" Description="Select the options you would like to use, they can be changed in the MaxRegnerUI folder later.">
			<Options>
				<CheckboxOption>
					<Text>Disable Hibernation</Text>
					<Name>disable-hibernation</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Maximum Performance (Disable Power Saving)</Text>
					<Name>disable-power-saving</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Disable Core Isolation</Text>
					<Name>disable-core-isolation</Name>
				</CheckboxOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://maxregnerui.com/docs/configuration"/>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Select the options you would like to use, they can be changed in the MaxRegnerUI folder later.">
			<Options>
				<CheckboxOption>
					<Text>Remove Snipping Tool App</Text>
					<Name>remove-snipping-tool</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Remove Microsoft Edge</Text>
					<Name>uninstall-edge</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Install a Browser</Text>
					<Name>install-another-browser</Name>
				</CheckboxOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://maxregnerui.com/docs/configuration"/>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Would you like to install MaxRegnerUI Toolbox (BETA)?">
			<Options>
				<CheckboxOption>
					<Text>Install MaxRegnerUI Toolbox</Text>
					<Name>install-toolbox</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<RadioImagePage CheckDefaultBrowser="true" DependsOn="install-another-browser" DefaultOption="browser-brave" Description="Select your preferred browser to install. Browser settings are not modified.">
			<TopLine Text="We do not recommend Chrome for privacy reasons."/>
			<Options>
				<RadioImageOption>
					<Text>Brave</Text>
					<Name>browser-brave</Name>
					<FileName>brave</FileName>
					<GradientTopColor>#131524</GradientTopColor>
					<GradientBottomColor>#3b3e4f</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>LibreWolf</Text>
					<Name>browser-librewolf</Name>
					<FileName>librewolf</FileName>
					<GradientTopColor>#057DB6</GradientTopColor>
					<GradientBottomColor>#86D8FF</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Firefox</Text>
					<Name>browser-firefox</Name>
					<FileName>firefox</FileName>
					<GradientTopColor>#FF3647</GradientTopColor>
					<GradientBottomColor>#FFC742</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Chrome</Text>
					<Name>browser-chrome</Name>
					<FileName>chrome</FileName>
					<GradientTopColor>#7E7E7E</GradientTopColor>
					<GradientBottomColor>#D0D0D0</GradientBottomColor>
				</RadioImageOption>
			</Options>
			<BottomLine Text="Which is best for me?" Link="https://maxregnerui.com/docs/browsers"/>
		</RadioImagePage>
	</FeaturePages>
</Playbook>
