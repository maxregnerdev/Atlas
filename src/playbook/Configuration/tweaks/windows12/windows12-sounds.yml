# Windows 12 Sounds Configuration
# Complete sound scheme for Windows 12 transformation
# Based on the Windows 12 concept from https://windows-12-web.vercel.app/

---
# Windows 12 Sounds Main Configuration
windows12_sounds:
  enabled: true
  description: "Complete Windows 12 sound scheme"
  
  # Sound Components
  components:
    system_sounds: true
    notification_sounds: true
    application_sounds: true
    custom_sounds: true
    sound_cache: true
  
  # Sound Settings
  settings:
    apply_all: true
    restart_explorer: false
    create_backup: true
    volume_level: 100
    
  # Version Information
  version:
    name: "Windows 12 Sounds"
    build: "12.0.50023"
    target: "25H2"
    concept_by: "immobilesmile70 | he/him"
    concept_url: "https://windows-12-web.vercel.app/"

---
# Windows 12 Sound Scheme Configuration
windows12_sound_scheme:
  # Sound Scheme Registry
  sound_scheme_registry:
    path: "HKCU:/AppEvents/Schemes/Windows12"
    
    settings:
      DisplayName: "Windows 12"
      Description: "Windows 12 Concept Sound Scheme by immobilesmile70"
      Author: "Macrohard Corporation"
      Version: "12.0"
      
  # Sound Scheme Files
  sound_scheme_files:
    # System Sounds
    SystemExclamation: "%windir%/Media/Windows12/Sounds/SystemExclamation.wav"
    SystemHand: "%windir%/Media/Windows12/Sounds/SystemHand.wav"
    SystemQuestion: "%windir%/Media/Windows12/Sounds/SystemQuestion.wav"
    SystemAsterisk: "%windir%/Media/Windows12/Sounds/SystemAsterisk.wav"
    SystemDefault: "%windir%/Media/Windows12/Sounds/SystemDefault.wav"
    
    # Notification Sounds
    Notification.Default: "%windir%/Media/Windows12/Sounds/Notification.wav"
    Notification.IM: "%windir%/Media/Windows12/Sounds/Notification.wav"
    Notification.Mail: "%windir%/Media/Windows12/Sounds/MailNotification.wav"
    Notification.Reminder: "%windir%/Media/Windows12/Sounds/Reminder.wav"
    Notification.Proximity: "%windir%/Media/Windows12/Sounds/Proximity.wav"
    Notification.SMS: "%windir%/Media/Windows12/Sounds/SMS.wav"
    
    # Application Sounds
    AppGPFault: "%windir%/Media/Windows12/Sounds/AppError.wav"
    BatteryCritical: "%windir%/Media/Windows12/Sounds/BatteryCritical.wav"
    BatteryLow: "%windir%/Media/Windows12/Sounds/BatteryLow.wav"
    CameraShutter: "%windir%/Media/Windows12/Sounds/CameraShutter.wav"
    DeviceConnect: "%windir%/Media/Windows12/Sounds/DeviceConnect.wav"
    DeviceDisconnect: "%windir%/Media/Windows12/Sounds/DeviceDisconnect.wav"
    DeviceFailedConnect: "%windir%/Media/Windows12/Sounds/DeviceFailedConnect.wav"
    Lock: "%windir%/Media/Windows12/Sounds/Lock.wav"
    Logoff: "%windir%/Media/Windows12/Sounds/Logoff.wav"
    Logon: "%windir%/Media/Windows12/Sounds/Logon.wav"
    PowerSleep: "%windir%/Media/Windows12/Sounds/Sleep.wav"
    PowerWake: "%windir%/Media/Windows12/Sounds/Wake.wav"
    RecycleBin: "%windir%/Media/Windows12/Sounds/Recycle.wav"
    Shutdown: "%windir%/Media/Windows12/Sounds/Shutdown.wav"
    Startup: "%windir%/Media/Windows12/Sounds/Startup.wav"
    Unlock: "%windir%/Media/Windows12/Sounds/Unlock.wav"
    UserAccountControl: "%windir%/Media/Windows12/Sounds/UAC.wav"
    WindowsFeedDiscovered: "%windir%/Media/Windows12/Sounds/FeedDiscovered.wav"
    WindowsUAC: "%windir%/Media/Windows12/Sounds/UAC.wav"
    
    # Custom Windows 12 Sounds
    Windows12_Alert: "%windir%/Media/Windows12/Sounds/Alert.wav"
    Windows12_Confirm: "%windir%/Media/Windows12/Sounds/Confirm.wav"
    Windows12_Error: "%windir%/Media/Windows12/Sounds/Error.wav"
    Windows12_Info: "%windir%/Media/Windows12/Sounds/Info.wav"
    Windows12_Success: "%windir%/Media/Windows12/Sounds/Success.wav"
    Windows12_Warning: "%windir%/Media/Windows12/Sounds/Warning.wav"

---
# Windows 12 Sound Files Configuration
windows12_sound_files:
  # Sound File Paths
  sound_paths:
    source_directory: "%src%/playbook/Sounds/Windows12"
    destination_directory: "%windir%/Media/Windows12/Sounds"
    
  # Sound File List
  sound_file_list:
