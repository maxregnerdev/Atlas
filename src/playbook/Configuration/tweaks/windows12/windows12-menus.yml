# Windows 12 Context Menus Configuration
# Complete context menu transformation based on Windows 12 concept
# https://windows-12-web.vercel.app/

---
# Windows 12 Context Menus Main Configuration
windows12_menus:
  enabled: true
  description: "Complete Windows 12 context menu transformation"
  
  # Menu Components
  components:
    desktop_menu: true
    file_menu: true
    folder_menu: true
    drive_menu: true
    special_menu: true
    new_menu: true
    send_to_menu: true
    custom_items: true
    styling: true
  
  # Menu Settings
  settings:
    apply_all: true
    restart_explorer: true
    create_backup: true
    enable_custom_items: true
    
  # Version Information
  version:
    name: "Windows 12 Context Menus"
    build: "12.0.50023"
    target: "25H2"
    concept_by: "immobilesmile70 | he/him"
    concept_url: "https://windows-12-web.vercel.app/"

---
# Windows 12 Desktop Context Menu Configuration
windows12_desktop_menu:
  # Desktop Menu Registry Path
  desktop_menu_path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/Advanced"
  
  # Desktop Menu Settings
  desktop_menu_settings:
    ContextMenuHandlers: ""
    ExtendedContextMenuHandlers: ""
    StartMenuAdminTools: 1
    StartMenuFavorites: 1
    
  # Desktop Menu Items
  desktop_menu_items:
    - name: "View"
      type: "submenu"
      items:
        - name: "Large icons"
          command: "LargeIcons"
          icon: "imageres.dll,-102"
          
        - name: "Medium icons"
          command: "MediumIcons"
          icon: "imageres.dll,-102"
          
        - name: "Small icons"
          command: "SmallIcons"
          icon: "imageres.dll,-102"
          
        - name: "-"
          type: "separator"
          
        - name: "Show desktop icons"
          command: "ToggleDesktopIcons"
          icon: "imageres.dll,-102"
          
        - name: "Auto arrange icons"
          command: "AutoArrange"
          icon: "imageres.dll,-102"
          
        - name: "Align icons to grid"
          command: "AlignToGrid"
          icon: "imageres.dll,-102"
          
    - name: "Sort by"
      type: "submenu"
      items:
        - name: "Name"
          command: "SortByName"
          icon: "imageres.dll,-102"
          
        - name: "Size"
          command: "SortBySize"
          icon: "imageres.dll,-102"
          
        - name: "Item type"
          command: "SortByType"
          icon: "imageres.dll,-102"
          
        - name: "Date modified"
          command: "SortByDate"
          icon: "imageres.dll,-102"
          
    - name: "Refresh"
      command: "Refresh"
      icon: "imageres.dll,-103"
      
    - name: "-"
      type: "separator"
      
    - name: "Paste"
      command: "Paste"
      icon: "imageres.dll,-25"
      
    - name: "Paste shortcut"
      command: "PasteShortcut"
      icon: "imageres.dll,-25"
      
    - name: "-"
      type: "separator"
      
    - name: "New"
      type: "submenu"
      items:
        - name: "Folder"
          command: "NewFolder"
          icon: "imageres.dll,-112"
          
        - name: "Shortcut"
          command: "NewShortcut"
          icon: "imageres.dll,-102"
          
        - name: "Text Document"
          command: "NewTextDocument"
          icon: "imageres.dll,-102"
          
        - name: "-"
          type: "separator"
          
        - name: "Windows 12 Folder"
          command: "NewWindows12Folder"
          icon: "%windir%/System32/Windows12/Icons/Folder.ico"
          
    - name: "-"
      type: "separator"
      
    - name: "Display settings"
      command: "DisplaySettings"
      icon: "imageres.dll,-104"
      
    - name: "Personalize"
      command: "Personalize"
      icon: "imageres.dll,-105"

