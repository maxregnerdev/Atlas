---
# Windows 12 Menu Styling Configuration
windows12_menu_styling:
  # Menu Style Settings
  menu_style:
    background_color: "#1C1C1C"
    text_color: "#FFFFFF"
    hover_color: "#0078D4"
    selected_color: "#005A9E"
    border_color: "#404040"
    separator_color: "#404040"
    
  # Menu Dimensions
  menu_dimensions:
    width: 240
    item_height: 32
    icon_size: 24
    icon_spacing: 8
    text_padding: 8
    
  # Menu Animations
  menu_animations:
    fade_in: 200
    fade_out: 150
    slide_in: 250
    slide_out: 200
    
  # Menu Shadows
  menu_shadows:
    enabled: true
    color: "#000000"
    opacity: 0.3
    blur: 8
    offset_x: 0
    offset_y: 4
    
  # Menu Border Radius
  menu_border_radius:
    main: 12
    item: 8
    submenu: 8
    
  # Menu Font
  menu_font:
    name: "Segoe UI"
    size: 9
    weight: 400
    style: "Normal"

---
# Windows 12 Menu Registry Configuration
windows12_menu_registry:
  # Menu Registry Settings
  menu_registry:
    path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/Advanced"
    
    settings:
      ContextMenuHandlers: ""
      ExtendedContextMenuHandlers: ""
      StartMenuAdminTools: 1
      StartMenuFavorites: 1
      StartMenuMyGames: 0
      StartMenuMyMusic: 0
      StartMenuMyPictures: 0
      StartMenuMyVideos: 0
      
  # Menu Performance Settings
  menu_performance:
    path: "HKCU:/Control Panel/Desktop/WindowMetrics"
    
    settings:
      MenuShowDelay: 200
      MenuFade: 1
      SelectionFade: 1

---
# Windows 12 Menu Application Configuration
windows12_menu_application:
  # Menu Application Settings
  application_settings:
    apply_to_all_users: true
    apply_to_new_users: true
    restart_explorer: true
    create_backup: true
    
  # Menu Application Order
  application_order:
    - desktop_menu
    - file_menu
    - folder_menu
    - drive_menu
    - special_menu
    - new_menu
    - send_to_menu
    - custom_items
    - styling
    
  # Menu Application Scripts
  application_scripts:
    main: "%src%/playbook/Executables/Windows12/UI/windows12-menu-engine.ps1"
    desktop: "%src%/playbook/Executables/Windows12/UI/windows12-desktop-menu.ps1"
    file: "%src%/playbook/Executables/Windows12/UI/windows12-file-menu.ps1"
    folder: "%src%/playbook/Executables/Windows12/UI/windows12-folder-menu.ps1"
    styling: "%src%/playbook/Executables/Windows12/UI/windows12-menu-styling.ps1"
