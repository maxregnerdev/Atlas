# Windows 12 Desktop Configuration
# Complete desktop UI transformation based on Windows 12 concept
# https://windows-12-web.vercel.app/

---
# Windows 12 Desktop Main Configuration
windows12_desktop:
  enabled: true
  description: "Complete Windows 12 Desktop UI transformation"
  
  # Desktop Components
  components:
    theme: true
    start_menu: true
    taskbar: true
    explorer: true
    display: true
    context_menu: true
    system_icons: true
    window_management: true
    file_explorer: true
    desktop_icons: true
  
  # Desktop Settings
  settings:
    apply_all: true
    restart_explorer: true
    create_backup: true
    enable_animations: true
    enable_transparency: true
    
  # Version Information
  version:
    name: "Windows 12 Desktop"
    build: "12.0.50023"
    target: "25H2"
    concept_by: "immobilesmile70"

---
# Windows 12 Desktop Theme Configuration
windows12_desktop_theme:
  # Theme Registry Path
  theme_path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Themes/Personalize"
  
  # Theme Settings - Windows 12 Dark Theme
  theme_settings:
    AppsUseLightTheme: 0
    SystemUsesLightTheme: 0
    WallpaperStyle: 2
    ColorPrevalence: 1
    EnableTransparency: 1
    StartColorMenu: 1
    StartColorTaskbar: 1
    StartColorActionCenter: 1
    AccentColor: "#0078D4"
    AccentPalette: "#0078D4,#47A3FF,#005A9E,#00B2FF,#0099CC"
    
  # Windows 12 Specific Theme Settings
  windows12_theme:
    ThemeName: "Windows12-Dark"
    ThemeVersion: "12.0"
    ThemeAuthor: "Macrohard Corporation"
    ThemeDescription: "Windows 12 Concept Theme by immobilesmile70"
    
  # Visual Effects - Windows 12 Style
  visual_effects:
    path: "HKCU:/Control Panel/Desktop/WindowMetrics"
    
    settings:
      MinAnimate: 1
      ShellState: "0x3"
      WindowArrangementActive: 1
      MinWidth: 384
      MinHeight: 288
      
  # Desktop Icons Settings
  desktop_icons:
    path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/Advanced"
    
    settings:
      IconsOnly: 0
      Start_ShowMyGames: 0
      Start_ShowMyApps: 0
      Start_ShowRecentApps: 1
      Start_ShowAllApps: 1
      DesktopIconSize: 48
      DesktopIconSpacing: 80
      
  # Desktop Background
  desktop_background:
    path: "HKCU:/Control Panel/Desktop"
    
    settings:
      Wallpaper: "C:/Windows/System32/Windows12/Images/wallpaper-dark.jpg"
      WallpaperStyle: "2"  # Fill
      TileWallpaper: "0"
      WallpaperOriginX: "0"
      WallpaperOriginY: "0"

---
# Windows 12 Desktop Colors Configuration
windows12_desktop_colors:
  # Color Registry Path
  color_path: "HKCU:/Control Panel/Colors"
  
  # Color Values - Windows 12 Dark Color Scheme
  color_values:
    ActiveBorder: "0 0 0"
    ActiveTitle: "0 0 0"
    AppWorkspace: "60 60 60"
    Background: "0 0 0"
    ButtonAlternativeFace: "80 80 80"
    ButtonDkShadow: "40 40 40"
    ButtonFace: "60 60 60"
    ButtonHilight: "100 100 100"
    ButtonLight: "80 80 80"
    ButtonShadow: "40 40 40"
    ButtonText: "255 255 255"
    CaptionText: "255 255 255"
    GrayText: "128 128 128"
    Hilight: "0 120 212"  # Windows 12 Accent Blue
    HilightText: "255 255 255"
    HotTrackingColor: "0 150 255"
    InactiveBorder: "40 40 40"
    InactiveTitle: "40 40 40"
    InactiveTitleText: "160 160 160"
    InfoText: "0 0 0"
    InfoWindow: "48 48 48"
    Menu: "48 48 48"
    MenuBar: "48 48 48"
    MenuHilight: "0 120 212"
    MenuText: "255 255 255"
    MessageBox: "48 48 48"
    Scrollbar: "80 80 80"
    TitleText: "255 255 255"
    Window: "48 48 48"
    WindowFrame: "0 0 0"
    WindowText: "255 255 255"
  
  # Accent Color Settings
  accent_color:
    path: "HKCU:/Software/Microsoft/Windows/DWM"
    
    settings:
      AccentColor: 16908804  # #0078D4 in decimal
      AccentColorInactive: 10603200
      ColorPrevalence: 1
      EnableTransparency: 1
      AlwaysHibernateThumbnails: 0

---
# Windows 12 Start Menu Configuration
windows12_start_menu:
  # Start Menu Registry Path
  start_path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/Advanced"
  
  # Start Menu Settings
  start_settings:
    Start_ShowAllApps: 1
    Start_ShowRecentApps: 1
    Start_ShowRecommendations: 0
    Start_ShowUserCloudSync: 0
    Start_ShowMyGames: 0
    Start_ShowMyApps: 0
    Start_ShowMyRecentDocs: 0
    Start_ShowMyPictures: 0
    Start_ShowMyMusic: 0
    Start_ShowMyVideos: 0
    Start_ShowMyPC: 0
    Start_ShowSearch: 1
    Start_ShowPower: 1
    Start_ShowSettings: 1
    Start_ShowFileExplorer: 1
    
  # Start Menu Layout - Windows 12 Style
  start_layout:
    path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/StartLayout"
    
    layout_file: "%src%/playbook/Layouts/Windows12/windows12-start-layout.xml"
    
  # Start Menu Size and Behavior
  start_size:
    path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/StartPage2"
    
    settings:
      Start_NumColumns: 3
      Start_NumMediumTiles: 6
      Start_NumWideTiles: 4
      Start_NumSmallTiles: 8
    
  # Start Menu Visual Settings
  start_visual:
    path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/Start"
    
    settings:
      StartSize: "Medium"
      StartColor: "#0078D4"
      StartTransparency: 1
      StartRoundedCorners: 1

---
# Windows 12 Taskbar Configuration
windows12_taskbar:
  # Taskbar Registry Path
  taskbar_path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/Advanced"
  
  # Taskbar Settings
  taskbar_settings:
    TaskbarGlomLevel: 1
    TaskbarSmallIcons: 0
    TaskbarButtonSize: 1
    TaskbarAutoHide: 0
    TaskbarAlwaysOnTop: 1
    TaskbarLockerEnabled: 0
    TaskbarShowPinnedApps: 1
    TaskbarShowRunningApps: 1
    TaskbarShowAllAppList: 0
    
  # Taskbar Position and Size
  taskbar_position:
    path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/StoredToolbars/Windows"
    
    settings:
      Position: "Bottom"
      Width: 1920
      Height: 48
      
  # Taskbar Style - Windows 12
  taskbar_style:
    path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer"
    
    settings:
      TaskbarColor: "#000000"
      TaskbarTransparency: 1
      TaskbarRoundedCorners: 1
      TaskbarIconSpacing: 8
      TaskbarTextColor: "#FFFFFF"
      TaskbarHoverColor: "#0078D4"
      TaskbarActiveColor: "#47A3FF"
    
  # Taskbar Context Menu
  taskbar_context:
    path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/Advanced"
    
    settings:
      TaskbarContextMenu: 1
      TaskbarShowToolTips: 1

---
# Windows 12 File Explorer Configuration
windows12_explorer:
  # Explorer Registry Path
  explorer_path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/Advanced"
  
  # Explorer Settings
  explorer_settings:
    IconsOnly: 0
    ListviewAlphaSelect: 1
    ListviewShadow: 1
    ListviewStripes: 0
    ShowCompColor: 1
    ShowInfoTip: 1
    ShowStatusBar: 1
    ShowThumbnails: 1
    ThumbnailSize: 256
    
  # Explorer View Settings
  explorer_view:
    path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer"
    
    settings:
      DefaultFolderView: 2  # Details
      DefaultSearchScope: 0
      DisableLocalMachine: 0
      DisableLocalMachineDefrag: 0
      DisableThumbnails: 0
      DisableThumbnailsOnNetworkFolders: 0
      
  # Explorer Navigation Pane
  explorer_navigation:
    path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/Advanced"
    
    settings:
      NavPaneShowAllFolders: 1
      NavPaneExpandToCurrentFolder: 1
      NavPaneShowCompressed: 1
      NavPaneShowLibraries: 0
      NavPaneShowFavorites: 1
      NavPaneShowHomeGroup: 0
      NavPaneShowNetwork: 1
      
  # Explorer Ribbon
  explorer_ribbon:
    path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/Ribbon"
    
    settings:
      Minimized: 0
      QatPlacement: 1
      StartWithClassic: 0

---
# Windows 12 Context Menu Configuration
windows12_context_menu:
  # Context Menu Settings
  context_menu_path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/Advanced"
  
  context_menu_settings:
    ContextMenuHandlers: ""
    ExtendedContextMenuHandlers: ""
    StartMenuAdminTools: 1
    StartMenuFavorites: 1
    StartMenuMyGames: 0
    StartMenuMyMusic: 0
    StartMenuMyPictures: 0
    StartMenuMyVideos: 0
    
  # Context Menu Style - Windows 12
  context_menu_style:
    path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer"
    
    settings:
      ContextMenuColor: "#0078D4"
      ContextMenuTextColor: "#FFFFFF"
      ContextMenuHoverColor: "#47A3FF"
      ContextMenuSelectedColor: "#005A9E"
      ContextMenuBorderRadius: 8
      ContextMenuShadow: 1
      ContextMenuTransparency: 1
    
  # Context Menu Items
  context_menu_items:
    # Windows 12 Specific Context Menu Items
    windows12_items:
      - name: "Open"
        command: "open"
        icon: "imageres.dll,-102"
        
      - name: "Open in new window"
        command: "opennewwindow"
        icon: "imageres.dll,-102"
        
      - name: "Open in new tab"
        command: "openintab"
        icon: "imageres.dll,-102"
        
      - name: "Run as administrator"
        command: "runas"
        icon: "imageres.dll,-78"
        
      - name: "Properties"
        command: "properties"
        icon: "imageres.dll,-103"
        
      - name: "-"
        type: "separator"
        
      - name: "Cut"
        command: "cut"
        icon: "imageres.dll,-54"
        
      - name: "Copy"
        command: "copy"
        icon: "imageres.dll,-24"
        
      - name: "Paste"
        command: "paste"
        icon: "imageres.dll,-25"
        
      - name: "Delete"
        command: "delete"
        icon: "imageres.dll,-32"
        
      - name: "Rename"
        command: "rename"
        icon: "imageres.dll,-156"

---
# Windows 12 System Icons Configuration
windows12_system_icons:
  # System Icons Path
  system_icons_path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/Shell Icons"
  
  # Icon Settings
  icon_settings:
    # Desktop Icons
    29: "C:/Windows/System32/Windows12/Icons/Computer.ico"  # This PC
    31: "C:/Windows/System32/Windows12/Icons/Network.ico"  # Network
    34: "C:/Windows/System32/Windows12/Icons/User.ico"   # User Files
    35: "C:/Windows/System32/Windows12/Icons/ControlPanel.ico"  # Control Panel
    36: "C:/Windows/System32/Windows12/Icons/Printers.ico"  # Printers
    45: "C:/Windows/System32/Windows12/Icons/RecycleBin.ico"  # Recycle Bin
    
  # Small Icons
  small_icons:
    29: "C:/Windows/System32/Windows12/Icons/Computer_small.ico"
    31: "C:/Windows/System32/Windows12/Icons/Network_small.ico"
    34: "C:/Windows/System32/Windows12/Icons/User_small.ico"
    35: "C:/Windows/System32/Windows12/Icons/ControlPanel_small.ico"
    36: "C:/Windows/System32/Windows12/Icons/Printers_small.ico"
    45: "C:/Windows/System32/Windows12/Icons/RecycleBin_small.ico"
    
  # Icon Sizes
  icon_sizes:
    Small: 32
    Medium: 48
    Large: 64
    ExtraLarge: 96

---
# Windows 12 Window Management Configuration
windows12_window_management:
  # Window Management Settings
  window_management_path: "HKCU:/Control Panel/Desktop/WindowMetrics"
  
  window_management_settings:
    MinWidth: 384
    MinHeight: 288
    MaxWidth: 3840
    MaxHeight: 2160
    BorderWidth: 1
    BorderHeight: 1
    CaptionWidth: 1
    CaptionHeight: 32
    
  # Snap Layouts - Windows 12
  snap_layouts:
    path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/Advanced"
    
    settings:
      SnapAssist: 1
      SnapFill: 1
      SnapAutoArrange: 1
      SnapDragFromMaximize: 1
      
  # Window Animations
  window_animations:
    path: "HKCU:/Control Panel/Desktop/WindowMetrics"
    
    settings:
      MinAnimate: 1
      ComboBoxAnimation: 1
      CursorShadow: 1
      DragFullWindows: 1
      GradientCaptions: 1
      ListBoxSmoothScrolling: 1
      MenuShowDelay: 200
      MenuFade: 1
      SelectionFade: 1
      ToolTipAnimation: 1
      WindowAnimation: 1

---
# Windows 12 Desktop Visual Effects
windows12_visual_effects:
  # Visual Effects Settings
  visual_effects_path: "HKCU:/Software/Microsoft/Windows/CurrentVersion/Explorer/VisualEffects"
  
  visual_effects_settings:
    Animations: 1
    DropShadow: 1
    FontSmoothing: 2  # ClearType
    FontSmoothingGamma: 1000
    FontSmoothingOrientation: 1  # BGR
    FontSmoothingType: 2
    ListViewAlphaSelect: 1
    ListViewFullRowSelect: 1
    ListViewGridLines: 0
    ListViewLineWrap: 1
    ListViewShowSelectAlways: 1
    ListViewUnderlineColdHot: 1
    ListViewUnderlineHot: 1
    ShellState: "0x3"
    TaskbarAnimations: 1
    ToolTipAnimations: 1
    
  # Windows 12 Specific Effects
  windows12_effects:
    EnableAcrylic: 1
    EnableMica: 1
    EnableRoundedCorners: 1
    EnableTransparency: 1
    EnableDynamicAccent: 1
    EnableFluentDesign: 1
