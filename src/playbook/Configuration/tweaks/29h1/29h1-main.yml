# Windows 11 29H1 Main Configuration
# Complete transformation system for Windows 11 25H2 to 29H1
# This is the master configuration that orchestrates all 29H1 components

---
# 29H1 Main Configuration
29h1_main:
  # Enable/Disable the complete 29H1 transformation
  enabled: true
  
  # Transformation Components
  components:
    oobe: true      # 29H1 OOBE System
    desktop: true   # 29H1 Desktop UI
    features: true  # 29H1 Core Features
  
  # Execution Settings
  execution:
    run_as_admin: true
    restart_explorer: true
    create_markers: true
    silent_mode: false
    force_reapply: false
  
  # Version Information
  version:
    name: "Windows 11 29H1"
    build: "29H1"
    target_build: "26200"  # 25H2 build
    transformation_date: "{{date}}"
  
  # Script Paths
  scripts:
    main_engine: "%src%\playbook\Executables\AtlasDesktop\29H1 Main\29h1-main-engine.ps1"
    oobe_engine: "%src%\playbook\Executables\AtlasDesktop\29H1 OOBE\29h1-oobe-engine.ps1"
    oobe_branding: "%src%\playbook\Executables\AtlasDesktop\29H1 OOBE\29h1-oobe-branding.ps1"
    oobe_features: "%src%\playbook\Executables\AtlasDesktop\29H1 OOBE\29h1-oobe-features.ps1"
    desktop_engine: "%src%\playbook\Executables\AtlasDesktop\29H1 UI\29h1-desktop-engine.ps1"
    desktop_theme: "%src%\playbook\Executables\AtlasDesktop\29H1 UI\29h1-desktop-theme.ps1"
    features_engine: "%src%\playbook\Executables\AtlasDesktop\29H1 Features\29h1-features-engine.ps1"
  
  # Completion Markers
  markers:
    complete: "%system32%\29h1-complete-transformation.flag"
    oobe_complete: "%system32%\29h1-oobe-complete.flag"
    desktop_complete: "%system32%\29h1-desktop-complete.flag"
    features_complete: "%system32%\29h1-features-complete.flag"
  
  # Registry Flags
  registry:
    version_path: "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"
    transformed_flag: "29H1_Transformed"
    version_flag: "29H1_Version"
    date_flag: "29H1_TransformationDate"

---
# 29H1 Component Order
29h1_order:
  - name: "29H1 OOBE System"
    script: "%src%\playbook\Executables\AtlasDesktop\29H1 OOBE\29h1-oobe-engine.ps1"
    priority: 10
    dependencies: []
    
  - name: "29H1 OOBE Branding"
    script: "%src%\playbook\Executables\AtlasDesktop\29H1 OOBE\29h1-oobe-branding.ps1"
    priority: 11
    dependencies: ["29H1 OOBE System"]
    
  - name: "29H1 OOBE Features"
    script: "%src%\playbook\Executables\AtlasDesktop\29H1 OOBE\29h1-oobe-features.ps1"
    priority: 12
    dependencies: ["29H1 OOBE System"]
    
  - name: "29H1 Desktop Engine"
    script: "%src%\playbook\Executables\AtlasDesktop\29H1 UI\29h1-desktop-engine.ps1"
    priority: 20
    dependencies: ["29H1 OOBE System"]
    
  - name: "29H1 Desktop Theme"
    script: "%src%\playbook\Executables\AtlasDesktop\29H1 UI\29h1-desktop-theme.ps1"
    priority: 21
    dependencies: ["29H1 Desktop Engine"]
    
  - name: "29H1 Features Engine"
    script: "%src%\playbook\Executables\AtlasDesktop\29H1 Features\29h1-features-engine.ps1"
    priority: 30
    dependencies: ["29H1 Desktop Engine"]
    
  - name: "29H1 Main Engine"
    script: "%src%\playbook\Executables\AtlasDesktop\29H1 Main\29h1-main-engine.ps1"
    priority: 1
    dependencies: []

---
# 29H1 Execution Parameters
29h1_parameters:
  main_engine:
    ApplyAll: true
    ApplyOOBE: true
    ApplyDesktop: true
    ApplyFeatures: true
    Silent: false
    Force: false
    
  oobe_engine:
    ConfigureAll: true
    ConfigureRegistry: true
    ConfigureBranding: true
    ConfigureFeatures: true
    BypassOOBE: true
    EnableAllSettings: true
    
  desktop_engine:
    ApplyAll: true
    ApplyTheme: true
    ApplyStartMenu: true
    ApplyTaskbar: true
    ApplyExplorer: true
    ApplyDisplay: true
    ApplyContextMenu: true
    ApplySystemIcons: true
    ApplyWindowManagement: true
    
  features_engine:
    EnableAll: true
    EnableAI: true
    EnableGaming: true
    EnableSecurity: true
    EnablePerformance: true
    EnableNetworking: true
    EnableStorage: true
    EnableAudio: true
    EnableUI: true

---
# 29H1 Feature Flags
29h1_features:
  oobe:
    enabled: true
    skip_all: true
    custom_branding: true
    enable_29h1_features: true
    bypass_tpm: true
    bypass_secure_boot: true
    bypass_ram_check: true
    bypass_storage_check: true
    bypass_cpu_check: true
    
  desktop:
    enabled: true
    apply_theme: true
    apply_icons: true
    apply_colors: true
    apply_sounds: true
    apply_wallpapers: true
    apply_fonts: true
    
  features:
    enabled: true
    ai_integration: true
    gaming_features: true
    security_features: true
    performance_features: true
    networking_features: true
    storage_features: true
    audio_features: true
    ui_features: true

---
# 29H1 Validation
29h1_validation:
  required_builds: ["26200", "26100"]
  check_admin: true
  check_power_shell_version: "5.1"
  create_backup: true
  backup_path: "%temp%\29h1-backup"
