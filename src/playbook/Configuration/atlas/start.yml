---
title: Windows 11 29H1 Initial Configuration
description: Performs preliminary 29H1 configuration for Windows 11 25H2 transformation
actions:
  - !writeStatus: {status: 'Setting Windows 11 29H1 environment'}
  
  # Set 29H1 transformation markers
  - !powerShell:
    wait: true
    command: |
      # Create 29H1 transformation directory
      $29h1Dir = "$env:SystemRoot\System32\29H1"
      if (-not (Test-Path $29h1Dir)) {
          New-Item -ItemType Directory -Path $29h1Dir -Force | Out-Null
      }
      
      # Set 29H1 version flags
      $versionPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"
      Set-ItemProperty -Path $versionPath -Name "29H1_Transformed" -Value 1 -Type DWord -Force
      Set-ItemProperty -Path $versionPath -Name "29H1_Version" -Value "29H1" -Type String -Force
      Set-ItemProperty -Path $versionPath -Name "29H1_TargetBuild" -Value "26200" -Type String -Force
      
      # Set Atlas 29H1 flag
      $atlasPath = "HKLM:\SOFTWARE\AtlasOS"
      if (-not (Test-Path $atlasPath)) {
          New-Item -Path $atlasPath -Force | Out-Null
      }
      Set-ItemProperty -Path $atlasPath -Name "29H1_Mode" -Value 1 -Type DWord -Force
      Set-ItemProperty -Path $atlasPath -Name "Version" -Value "29H1" -Type String -Force
  
  - !writeStatus: {status: 'Configuring 29H1 module paths'}
  - !powerShell:
    wait: true
    command: |
      function Add-ToPath ([array]$Paths) {
            $machine = [System.EnvironmentVariableTarget]::Machine
            $separator = [IO.Path]::PathSeparator

            $Paths | ForEach-Object {
                  if (!(Test-Path $_ -PathType Container)) {
                        Write-Error "Path '$_' doesn't exist as a container."
                  }
            }

            $newPath = @()
            $newPath += [Environment]::GetEnvironmentVariable('PATH', $machine) -split $separator
            if ($newPath.Count -eq 0) { Write-Warning 'The PATH variable is currently empty.' }
            $newPath += $Paths
            $newPath = $newPath | Where-Object { $_ } | Select-Object -Unique

            [Environment]::SetEnvironmentVariable('PATH', "$($newPath -join $separator)", $machine)
      }

      $modulesPath = "$([Environment]::GetFolderPath('Windows'))\29H1AtlasModules"
      $legacyPath = "$([Environment]::GetFolderPath('Windows'))\AtlasModules"
      
      Add-ToPath "$modulesPath", "$modulesPath\Tools", "$modulesPath\Scripts", "$legacyPath", "$legacyPath\Tools", "$legacyPath\Scripts"

  ################ NO LOCAL BUILD - 29H1 ENHANCED ################

  - !writeStatus: {status: 'Enabling 29H1 DirectPlay'}
  - !run: {exe: 'DISM.exe', args: '/Online /Enable-Feature /FeatureName:"DirectPlay" /NoRestart /All', weight: 30}
  
  - !run: {exe: 'DISM.exe', args: '/Online /Remove-Capability /CapabilityName:"App.StepsRecorder~~~~0.0.1.0" /NoRestart', weight: 30, onUpgrade: false}

  - !writeStatus: {status: 'Cleaning the component store for 29H1'}
  - !run: {exe: 'DISM.exe', args: '/Online /Cleanup-Image /StartComponentCleanup', weight: 50}

  - !writeStatus: {status: 'Enabling 29H1 Windows Features'}
  - !run: {exe: 'DISM.exe', args: '/Online /Enable-Feature /FeatureName:"VirtualMachinePlatform" /NoRestart /All', weight: 40}
  - !run: {exe: 'DISM.exe', args: '/Online /Enable-Feature /FeatureName:"WindowsSubsystemForLinux" /NoRestart /All', weight: 40}
  - !run: {exe: 'DISM.exe', args: '/Online /Enable-Feature /FeatureName:"HyperV" /NoRestart /All', weight: 40, onUpgrade: false}
  
  - !writeStatus: {status: 'Removing 25H2 legacy components'}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:"WindowsMediaPlayer" /NoRestart', weight: 20}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:"Internet-Explorer-Optional-amd64" /NoRestart', weight: 20}

    # Initial 29H1 software
    # 7-Zip, Visual C++ Runtimes, DirectX - 29H1 optimized versions
  - !writeStatus: {status: 'Installing 29H1 utilities'}
  - !powerShell:
    command: '.\SOFTWARE.ps1 -29H1Mode'
    exeDir: true
    wait: true
    weight: 150
    runas: currentUserElevated

    # 29H1 Toolbox
  - !writeStatus: {status: 'Installing Windows 11 29H1 Toolbox'}
  - !powerShell:
    command: '.\SOFTWARE.ps1 -29H1Toolbox'
    exeDir: true
    wait: true
    weight: 100
    option: 'install-29h1-toolbox'
    runas: currentUserElevated

    # 29H1 Browsers
  - !writeStatus: {status: 'Installing 29H1 Brave Browser', option: 'browser-brave-29h1'}
  - !powerShell:
    command: '.\SOFTWARE.ps1 -29H1Brave'
    exeDir: true
    wait: true
    weight: 120
    option: 'browser-brave-29h1'
    runas: currentUserElevated
  
  - !writeStatus: {status: 'Installing 29H1 Firefox', option: 'browser-firefox-29h1'}
  - !powerShell:
    command: '.\SOFTWARE.ps1 -29H1Firefox'
    exeDir: true
    wait: true
    weight: 120
    option: 'browser-firefox-29h1'
    runas: currentUserElevated

  ################ END NO LOCAL BUILD ################

  # 29H1 Specific Initialization
  - !writeStatus: {status: 'Initializing 29H1 transformation'}
  - !powerShell:
    command: '$windir = [Environment]::GetFolderPath("Windows"); & "$windir\AtlasDesktop\29H1 Main\29h1-main-engine.ps1" -Initialize'
    wait: true
    weight: 200
    runas: currentUserElevated
