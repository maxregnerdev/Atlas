---
title: Windows 11 29H1 AppX Management
description: Removes AppX packages and prevents them from being reinstalled - Optimized for 29H1
onUpgrade: false
actions:
  - !writeStatus: {status: 'Removing AppX packages for 29H1 optimization'}
  
  # Windows 11 29H1 AppX Management
  # The reason for removing these applications is that they might be sending user data,
  # showing unwanted content and using hardware resources. However, most of these applications 
  # can be reinstalled via Microsoft Store in case the user needs them.
  #
  # 29H1 keeps essential AI and gaming apps while removing legacy bloat

  # https://docs.microsoft.com/en-us/windows/application-management/apps-in-windows-11

  #####################################################################################################

  # Get current AppX packages to deprovision removed ones afterward
  - !powerShell:
    command: |
      (Get-AppxPackage).PackageFamilyName |
        Out-File "$([Environment]::GetFolderPath('Windows'))\29H1AtlasModules\AtlasPackagesOld.txt"
    runas: currentUserElevated
    wait: true

  # 29H1: KEEP Copilot and AI apps (29H1 feature)
  # - !appx: {name: 'Microsoft.Copilot*', type: family}  # KEEP for 29H1

  # 29H1: KEEP Xbox apps (29H1 gaming features)
  # - !appx: {name: 'Microsoft.XboxApp*', type: family}  # KEEP for 29H1

  # Legacy AppX Teams - Remove
  - !taskKill: {name: 'msteams*', ignoreErrors: true}
  - !appx: {name: 'MicrosoftTeams*', type: family}

  # New AppX Teams - Remove
  - !taskKill: {name: 'ms-teams*', ignoreErrors: true}
  - !appx: {name: 'MSTeams*', type: family}

  # Other apps to remove for 29H1
  - !appx: {name: 'Clipchamp.Clipchamp*', type: family}
  - !appx: {name: 'Disney.37853FC22B2CE*', type: family}
  - !appx: {name: 'SpotifyAB.SpotifyMusic*', type: family}
  - !appx: {name: 'Microsoft.549981C3F5F10*', type: family} # Cortana (replaced by Copilot in 29H1)
  - !appx: {name: 'microsoft.windowscommunicationsapps*', type: family} # Mail and Calendar
  - !appx: {name: 'Microsoft.MSPaint*', type: family} # Paint 3D
  - !appx: {name: 'Microsoft.Getstarted*', type: family} # Tips (deprecated)
  - !appx: {name: 'Microsoft.ZuneVideo*', type: family} # Films & TV
  - !appx: {name: 'MicrosoftCorporationII.MicrosoftFamily*', type: family}
  - !appx: {name: 'Microsoft.MixedReality.Portal*', type: family}
  - !appx: {name: 'Microsoft.Windows.DevHome*', type: family}
  - !appx: {name: 'Microsoft.BingWeather*', type: family}

  ##############################################################################################
  ## 29H1 AI & GAMING APPS - KEEP                                                               ##
  ##############################################################################################

  # 29H1: Keep essential AI applications
  - !writeStatus: {status: 'Preserving 29H1 AI applications'}
  
  # Keep Copilot for 29H1
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'EnableCopilot', data: '1', type: REG_DWORD}
  
  # Keep Xbox for 29H1 gaming
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\GameUX', value: 'GameModeEnabled', data: '1', type: REG_DWORD}

  ##############################################################################################
  ## 29H1 APPX PREVENTION                                                                       ##
  ##############################################################################################

  # Prevent AppX packages from being reinstalled
  - !writeStatus: {status: 'Preventing AppX reinstallation for 29H1'}

  # Deprovision removed packages
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\MicrosoftTeams*', operation: add}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\MSTeams*', operation: add}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Clipchamp.Clipchamp*', operation: add}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Disney.37853FC22B2CE*', operation: add}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\SpotifyAB.SpotifyMusic*', operation: add}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.549981C3F5F10*', operation: add}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\microsoft.windowscommunicationsapps*', operation: add}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.MSPaint*', operation: add}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.Getstarted*', operation: add}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.ZuneVideo*', operation: add}

  # Disable Microsoft Store auto-update for removed apps
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Store', value: 'AutoDownload', data: '2', type: REG_DWORD}

  ##############################################################################################
  ## 29H1 MICROSOFT STORE CONFIGURATION                                                          ##
  ##############################################################################################

  # Configure Microsoft Store for 29H1
  - !writeStatus: {status: 'Configuring Microsoft Store for 29H1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsStore', value: 'DisableStoreApplications', data: '0', type: REG_DWORD}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsStore', value: 'DisableOSUpgrade', data: '0', type: REG_DWORD}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsStore', value: 'UpdateAutomatically', data: '1', type: REG_DWORD}
