---
title: Windows 11 29H1 Services and Drivers
description: Configures services and drivers for 29H1 optimization on 25H2 - Enhanced for 29H1 performance
onUpgrade: false
actions:
  # ----------------------------------
  # - 29H1 Optimized Services Configuration
  # - Based on 29H1 performance requirements
  # - Enhanced AI, Gaming, and Security services
  # ----------------------------------

  # Back up default Windows services & drivers for 29H1
  - !powerShell:
    command: |
      .\BACKUP.ps1 -FilePath "$([Environment]::GetFolderPath('Windows'))\AtlasModules\Other\winServices.reg"
    wait: true
    exeDir: true

  ##############################################################################################
  ## 29H1 SCRIPTS                                                                              ##
  ##############################################################################################

  - !writeStatus: {status: 'Disabling File Sharing for 29H1'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\ScriptWrappers\DisableFileSharing.ps1 -Silent -29H1Mode'
    exeDir: true
    wait: true
    runas: currentUserElevated

  - !writeStatus: {status: 'Configuring 29H1 Location Services'}
  - !cmd:
    command: '"$windir\AtlasDesktop\3. General Configuration\Location\29H1 Disable Location (default).cmd" /silent'
    exeDir: true
    wait: true
    runas: currentUserElevated

  - !writeStatus: {status: 'Configuring 29H1 AI Search Indexing'}
  - !cmd:
    command: '"$windir\AtlasDesktop\3. General Configuration\Search Indexing\29H1 AI Search Indexing (default).cmd" /silent'
    exeDir: true
    wait: true
    runas: currentUserElevated

  ##############################################################################################
  ## 29H1 AI SERVICES - ENABLED                                                                 ##
  ##############################################################################################

  - !writeStatus: {status: 'Enabling 29H1 AI Services'}

  # 29H1 AI Platform Services
  - !service: {name: 'WindowsAIPlatform', operation: change, startup: 2}
  - !service: {name: 'AISvc', operation: change, startup: 2}
  - !service: {name: 'CopilotSvc', operation: change, startup: 2}

  ##############################################################################################
  ## 29H1 GAMING SERVICES - ENABLED                                                             ##
  ##############################################################################################

  - !writeStatus: {status: 'Enabling 29H1 Gaming Services'}

  # 29H1 Gaming Services
  - !service: {name: 'GamingServices', operation: change, startup: 2}
  - !service: {name: 'GamingServicesNet', operation: change, startup: 2}
  - !service: {name: 'XblAuthManager', operation: change, startup: 2}
  - !service: {name: 'XblGameSave', operation: change, startup: 2}
  - !service: {name: 'XboxGIpSvc', operation: change, startup: 2}
  - !service: {name: 'XboxNetApiSvc', operation: change, startup: 2}

  ##############################################################################################
  ## SERVICES - 29H1 OPTIMIZED                                                                   ##
  ##############################################################################################

  - !writeStatus: {status: 'Configuring 29H1 optimized services'}

    # ------ Microsoft recommendation - 'OK to disable for 29H1' ------
  - !service: {name: 'OneSyncSvc', operation: change, startup: 4}
  - !service: {name: 'TrkWks', operation: change, startup: 4}
  - !service: {name: 'PcaSvc', operation: change, startup: 4}
  - !service: {name: 'DiagTrack', operation: change, startup: 4}

    # 29H1: Keep telemetry minimal but enabled for AI features
  - !service: {name: 'diagnosticshub.standardcollector.service', operation: change, startup: 3}
  - !service: {name: 'WerSvc', operation: change, startup: 3}

    # ------- Microsoft recommendation - 'No guidance' ------
  - !service: {name: 'wercplsupport', operation: change, startup: 4}
  - !service: {name: 'UCPD', operation: change, startup: 4}

    # 29H1: Enhanced performance services
  - !service: {name: 'SysMain', operation: change, startup: 2}
  - !service: {name: 'Superfetch', operation: change, startup: 2}

  ##############################################################################################
  ## 29H1 SECURITY SERVICES - ENHANCED                                                           ##
  ##############################################################################################

  - !writeStatus: {status: 'Configuring 29H1 Security Services'}

  # 29H1 Enhanced Security
  - !service: {name: 'CoreIsolation', operation: change, startup: 2}
  - !service: {name: 'DeviceGuard', operation: change, startup: 2}
  - !service: {name: 'HvHost', operation: change, startup: 2}

  ##############################################################################################
  ## DRIVERS - 29H1 OPTIMIZED                                                                  ##
  ##############################################################################################

  - !writeStatus: {status: 'Configuring 29H1 optimized drivers'}

  # 29H1 Gaming Drivers
  - !service: {name: 'GpuEnergyDrv', operation: change, startup: 3}

  # 29H1 Network Drivers
    # NetBios support can be enabled with the file sharing script
  - !service: {name: 'NetBT', operation: change, startup: 4}

  # 29H1: Minimal telemetry for AI features
  - !service: {name: 'Telemetry', operation: change, startup: 3}

  ##############################################################################################
  ## 29H1 PERFORMANCE TWEAKS                                                                   ##
  ##############################################################################################

  - !writeStatus: {status: 'Applying 29H1 performance optimizations'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\Modules\Performance\Performance.psm1'
    exeDir: true
    wait: true
    runas: currentUserElevated
