<Playbook>
	<Name>Windows12</Name>
	<Username>Windows12</Username>
	<Title>Windows 12 Transformation v1.0.0</Title>
	<ShortDescription>Complete Windows 12 UI transformation for Windows 11 25H2</ShortDescription>
	<Description><![CDATA[Macrohard Windows 12 Transformation. Complete UI transformation based on Windows 12 concept from https://windows-12-web.vercel.app/. By: immobilesmile70 | he/him - Game Dev | Web Dev | UI/UX Enthusiast. Transform your Windows 11 25H2 to Windows 12 UI including icons, OOBE, menus, styles, colors, everything.]]></Description>
	<Details>A complete transformation of Windows 11 25H2 to Windows 12 UI based on the concept from https://windows-12-web.vercel.app/. This playbook includes everything: icons, OOBE, menus, styles, colors, wallpapers, sounds, themes, and all visual elements to create a full Windows 12 experience.</Details>
	<ProgressText><![CDATA[Windows 12 transformation is currently being applied. This includes UI changes, theme application, icon replacement, OOBE customization, and much more. Please wait while your system is transformed into Windows 12.]]></ProgressText>
	<Version>1.0.0</Version>
	<SupportedBuilds>
		<!-- Windows 11 25H2 -->
		<string>26200</string>
		<string>26217</string>
		<string>26227</string>
		<string>26231</string>
	</SupportedBuilds>
	<UpgradableFrom>0.5.0</UpgradableFrom>
	<Requirements>
		<Requirement>DefenderToggled</Requirement>
		<Requirement>NoAntivirus</Requirement>
		<Requirement>Internet</Requirement>
		<Requirement>NoPendingUpdates</Requirement>
		<Requirement>UCPDDisabled</Requirement>
		<Requirement>PluggedIn</Requirement>
	</Requirements>
	<UniqueId>12000000-0000-4000-7769-6e646f777331</UniqueId>
	<InstallGuide>https://github.com/maxregnerdev/Atlas/tree/main/src/playbook/Configuration/tweaks/windows12</InstallGuide>
	<Overhaul>true</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<AllowUnsupportedUpgrades>false</AllowUnsupportedUpgrades>
	<ProductCode>64</ProductCode>
	<EstimatedMinutes>20</EstimatedMinutes>
	<Git>https://github.com/maxregnerdev/Atlas</Git>
	<Website>https://windows-12-web.vercel.app/</Website>
	<DonateLink>https://github.com/sponsors/immobilesmile70</DonateLink>
	<SupportsISO>true</SupportsISO>
	<OOBE>
		<BulletPoints>
			<BulletPoint Icon="Windows" Title="Windows 12 UI" 
			Description="Complete transformation to Windows 12 user interface including all visual elements"/>
			<BulletPoint Icon="Paint" Title="Themes & Colors"
			Description="Windows 12 dark and light themes with custom color palette and styling"/>
			<BulletPoint Icon="Icons" Title="Icon Pack"
			Description="Full Windows 12 icon set replacing all system icons"/>
			<BulletPoint Icon="OOBE" Title="Custom OOBE"
			Description="Windows 12 styled Out-of-Box Experience with custom branding"/>
			<BulletPoint Icon="Sounds" Title="Sound Scheme"
			Description="Windows 12 custom sound scheme and system sounds"/>
			<BulletPoint Icon="Menus" Title="Context Menus"
			Description="Windows 12 styled context menus with custom items and styling"/>
		</BulletPoints>
		<Internet>Force</Internet>
	</OOBE>
	<ISO>
		<DisableBitLocker>true</DisableBitLocker>
		<DisableHardwareRequirements>true</DisableHardwareRequirements>
	</ISO>
	<FeaturePages>
		<RadioPage IsRequired="true" DefaultOption="windows12-full" Description="Choose the Windows 12 transformation level">
			<TopLine Text="Full transformation includes all UI elements, themes, icons, and sounds."/>
			<Options>
				<RadioOption>
					<Text>Full Windows 12 Transformation (recommended)</Text>
					<Name>windows12-full</Name>
				</RadioOption>
				<RadioOption>
					<Text>Windows 12 UI Only (themes, colors, styles)</Text>
					<Name>windows12-ui-only</Name>
				</RadioOption>
				<RadioOption>
					<Text>Windows 12 Icons Only</Text>
					<Name>windows12-icons-only</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://windows-12-web.vercel.app/"/>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="theme-dark" Description="Select the Windows 12 theme color scheme">
			<TopLine Text="Dark theme is the primary Windows 12 experience."/>
			<Options>
				<RadioOption>
					<Text>Windows 12 Dark Theme (recommended)</Text>
					<Name>theme-dark</Name>
				</RadioOption>
				<RadioOption>
					<Text>Windows 12 Light Theme</Text>
					<Name>theme-light</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="Preview themes" Link="https://windows-12-web.vercel.app/"/>
		</RadioPage>
		<CheckboxPage IsRequired="true" Description="Select additional Windows 12 features to install">
			<Options>
				<CheckboxOption>
					<Text>Windows 12 Custom Sounds</Text>
					<Name>sounds-enabled</Name>
					<DefaultChecked>true</DefaultChecked>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Windows 12 Custom Cursors</Text>
					<Name>cursors-enabled</Name>
					<DefaultChecked>true</DefaultChecked>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Windows 12 Custom Wallpapers</Text>
					<Name>wallpapers-enabled</Name>
					<DefaultChecked>true</DefaultChecked>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Windows 12 Context Menu Enhancements</Text>
					<Name>menus-enabled</Name>
					<DefaultChecked>true</DefaultChecked>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Windows 12 OOBE Customization</Text>
					<Name>oobe-enabled</Name>
					<DefaultChecked>true</DefaultChecked>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Windows 12 AI Features (Copilot, etc.)</Text>
					<Name>ai-enabled</Name>
					<DefaultChecked>false</DefaultChecked>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
	</FeaturePages>
	<Components>
		<Component>
			<Name>Windows12 Main Configuration</Name>
			<Description>Main Windows 12 transformation engine and configuration</Description>
			<Actions>
				<Action Type="Task" Path="tweaks\windows12\windows12-main.yml" />
			</Actions>
		</Component>
		<Component>
			<Name>Windows12 OOBE</Name>
			<Description>Windows 12 Out-of-Box Experience customization</Description>
			<Actions>
				<Action Type="Task" Path="tweaks\windows12\windows12-oobe.yml" />
			</Actions>
		</Component>
		<Component>
			<Name>Windows12 Desktop</Name>
			<Description>Windows 12 Desktop UI transformation</Description>
			<Actions>
				<Action Type="Task" Path="tweaks\windows12\windows12-desktop.yml" />
			</Actions>
		</Component>
		<Component>
			<Name>Windows12 Features</Name>
			<Description>Windows 12 features and system configuration</Description>
			<Actions>
				<Action Type="Task" Path="tweaks\windows12\windows12-features.yml" />
			</Actions>
		</Component>
		<Component>
			<Name>Windows12 Theme</Name>
			<Description>Windows 12 theme, colors, fonts, and styling</Description>
			<Actions>
				<Action Type="Task" Path="tweaks\windows12\windows12-theme.yml" />
			</Actions>
		</Component>
	</Components>
	<PostInstall>
		<Action Type="PowerShell" Command="Write-Host 'Windows 12 transformation complete!' -ForegroundColor Cyan" />
		<Action Type="PowerShell" Command="Write-Host 'Your Windows 11 25H2 has been transformed to Windows 12 UI' -ForegroundColor Green" />
		<Action Type="PowerShell" Command="Write-Host 'Concept by: immobilesmile70 | he/him' -ForegroundColor Yellow" />
		<Action Type="PowerShell" Command="Write-Host 'Source: https://windows-12-web.vercel.app/' -ForegroundColor Magenta" />
	</PostInstall>
</Playbook>
